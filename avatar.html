<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avatar – KAVIX</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/theme.css">
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="index.html"><img src="assets/logo.svg" alt="">KAVIX</a>
  <nav class="main" aria-label="Main"><a href="index.html">Games</a><a href="studio.html">Studio</a><a href="avatar.html" aria-current="page">Avatar</a></nav>
</div></header>
<main class="wrap editor">
  <div class="stage" id="stage"><canvas id="cv" tabindex="0" aria-label="Your avatar. Drag or use the arrow keys to turn it."></canvas></div>
  <section class="panel" aria-labelledby="t">
    <h1 id="t">Your avatar</h1>
    <div id="controls"></div>
    <div class="actions"><button class="btn ghost" id="rand" type="button">Randomize</button><button class="btn ghost" id="walk" type="button" aria-pressed="false">Walk</button><button class="btn" id="save" type="button" disabled>Save avatar</button></div>
    <p class="note" id="status" role="status"></p>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/api.js"></script>
<script src="js/avatar.js"></script>
<script src="js/avatar-page.js"></script>
</body>
</html>
